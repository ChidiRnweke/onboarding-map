<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg {
      fill: #e4e9e2;
    }
    .ring {
      fill: none;
      stroke: #d3dbd3;
      stroke-width: 1.4;
    }
    .route {
      fill: none;
      stroke: #2436c4;
      stroke-width: 3;
      stroke-linecap: round;
    }
    .node-done {
      fill: #2436c4;
      stroke: #e4e9e2;
      stroke-width: 1.2;
    }
    .node-ahead {
      fill: #e4e9e2;
      stroke: #8d9a98;
      stroke-width: 1.4;
    }
    .hub-ring {
