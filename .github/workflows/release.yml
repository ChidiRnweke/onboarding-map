name: Release

# release-please keeps a release PR open with the next version and changelog.
# Merging it creates the tag and GitHub release; the publish job below then
# puts that version on npm.
#
# The publish runs here rather than on the tag push, because a tag pushed with
# the default GITHUB_TOKEN starts no workflow run. It also has to stay in this
# file: npm Trusted Publishing (OIDC, no token) is bound to release.yml.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      # prepack builds dist/, schema/ and the app shell.
      - run: npm publish
