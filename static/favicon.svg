  </style>
  <rect class="bg" x="2" y="2" width="60" height="60" rx="13" ry="13" />
  <circle class="ring" cx="32" cy="32" r="25" />
  <path class="route" d="M32,32 L41.5,48.45 Q51.9,43.5 51,32 Q51.9,20.5 41.5,15.55" />
  <circle class="node-done" cx="41.5" cy="48.45" r="3.3" />
  <circle class="node-done" cx="51" cy="32" r="3.6" />
  <circle class="node-ahead" cx="41.5" cy="15.55" r="3.2" />
  <circle class="hub-ring" cx="32" cy="32" r="5" />
  <circle class="hub-dot" cx="32" cy="32" r="2" />
