name: Release

# Publishes to npm when a version tag is pushed (`npm version patch && git push --follow-tags`).
# Uses npm Trusted Publishing (OIDC): no token is stored; configure it once on
# npmjs.com → onboarding-map → Settings → Trusted publishing → GitHub Actions,
# repository ChidiRnweke/onboarding-map, workflow release.yml.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      # prepack builds dist/, schema/ and the app shell.
      - run: npm publish
